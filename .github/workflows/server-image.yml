name: Build Elir Server Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'Dockerfile'
      - 'package.json'
      - 'next.config.ts'
      - '.github/workflows/server-image.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build temporary transfer image
        run: |
          docker build -t ttl.sh/elir-svetlana-yc-20260918:24h .
          docker push ttl.sh/elir-svetlana-yc-20260918:24h
